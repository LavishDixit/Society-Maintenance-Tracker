{% extends "base.html" %}
{% block title %}Update Complaint #{{ complaint.id }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h4>Update Complaint #{{ complaint.id }}</h4>
      <p class="text-muted">{{ complaint.description|truncatewords:25 }}</p>
      <form method="post" enctype="multipart/form-data" id="updateForm" onsubmit="return confirmIfResolving();">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Update</button>
        <a href="{% url 'complaints:admin_list' %}" class="btn btn-link">Cancel</a>
      </form>
    </div>
  </div>
</div>

<script>
function confirmIfResolving() {
    var statusField = document.getElementById('id_status');
    if (statusField && statusField.value === 'resolved') {
        return confirm('Mark this complaint as Resolved? It will be considered closed.');
    }
    return true;
}
</script>
{% endblock %}
