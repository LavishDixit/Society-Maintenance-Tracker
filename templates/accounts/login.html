{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h3 class="mb-1">Sign In</h3>
      <p class="text-muted mono mb-3" style="font-size:0.8rem;">Society Maintenance Register</p>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'accounts:signup' %}">Sign up as resident</a></p>
    </div>
  </div>
</div>
{% endblock %}
