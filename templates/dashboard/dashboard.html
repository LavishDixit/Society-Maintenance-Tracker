{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="mb-4">
  <h3 class="mb-0">Admin Dashboard</h3>
  <p class="text-muted mb-0 mono" style="font-size: 0.8rem;">Snapshot as of {% now "d M Y, H:i" %}</p>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="stat-tile">
      <div class="stat-number">{{ total }}</div>
      <div class="stat-label">Total Complaints</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="stat-tile alert">
      <div class="stat-number">{{ overdue_count }}</div>
      <div class="stat-label">Overdue</div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-md-6">
    <div class="card p-3">
      <h6 class="mono text-uppercase text-muted mb-3" style="letter-spacing:0.06em; font-size:0.75rem;">By Status</h6>
      <canvas id="statusChart" height="220"></canvas>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <h6 class="mono text-uppercase text-muted mb-3" style="letter-spacing:0.06em; font-size:0.75rem;">By Category</h6>
      <canvas id="categoryChart" height="220"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
const statusData = {{ status_chart_json|safe }};
const categoryData = {{ category_chart_json|safe }};

const chartColors = ['#243350', '#b98b2e', '#4f7855', '#a63d2f', '#5b6472', '#7a8b99'];

new Chart(document.getElementById('statusChart'), {
    type: 'doughnut',
    data: {
        labels: statusData.labels,
        datasets: [{ data: statusData.values, backgroundColor: chartColors }]
    },
    options: { plugins: { legend: { position: 'bottom' } } }
});

new Chart(document.getElementById('categoryChart'), {
    type: 'bar',
    data: {
        labels: categoryData.labels,
        datasets: [{ label: 'Complaints', data: categoryData.values, backgroundColor: '#243350' }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
});
</script>
{% endblock %}
